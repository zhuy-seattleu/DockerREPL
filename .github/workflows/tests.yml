name: Tests

on:
  push:                 # every push to any branch; results show on its PR too
  workflow_dispatch:    # "Run workflow" button in the Actions tab

jobs:
  tests:
    name: Tests by build step
    runs-on: ubuntu-latest   # has Docker, so @pytest.mark.docker tests run here
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: pip install -e ".[dev]"

      - name: Run each step's tests
        run: bash scripts/run_step_tests.sh
